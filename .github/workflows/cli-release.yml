name: CLI Release

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Validate tag and package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          test "$tag_version" = "$package_version"
      - run: npm run verify:cli
      - run: npm pack --workspace @incidentlens/cli
      - name: Publish with npm provenance
        run: npm publish --workspace @incidentlens/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
