[project]
name = "incidentlens-scenarios"
version = "0.1.0"
description = "Fault scenario definitions and management for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_scenarios"]
