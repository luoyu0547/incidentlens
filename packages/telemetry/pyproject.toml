[project]
name = "incidentlens-telemetry"
version = "0.1.0"
description = "SQLite telemetry persistence and query layer for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "incidentlens-contracts",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_telemetry"]
