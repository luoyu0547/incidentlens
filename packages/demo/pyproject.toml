[project]
name = "incidentlens-demo"
version = "0.1.0"
description = "Reusable end-to-end demo runner and CLI for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "incidentlens-contracts",
    "incidentlens-scenarios",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_demo"]
