[project]
name = "incidentlens"
version = "0.1.0"
description = "Evidence-driven microservice incident investigation agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "incidentlens-contracts",
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
]

[tool.uv.sources]
incidentlens-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
