[project]
name = "incidentlens"
version = "0.2.0"
description = "A safety-first cloud incident investigation control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
    "httpx2>=2.0,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/control-plane/src/incidentlens_control_plane"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
