[project]
name = "incidentlens"
version = "0.1.0"
description = "Evidence-driven microservice incident investigation agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "incidentlens-contracts",
    "incidentlens-telemetry",
    "incidentlens-scenarios",
    "incidentlens-service-common",
    "incidentlens-control-plane",
    "incidentlens-gateway-service",
    "incidentlens-order-service",
    "incidentlens-payment-service",
    "incidentlens-evaluation",
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.28,<1",
    "sse-starlette>=2.0,<3",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/telemetry",
    "packages/scenarios",
    "apps/shared-service",
    "apps/gateway-service",
    "apps/order-service",
    "apps/payment-service",
    "apps/control-plane",
    "packages/evaluation",
]

[tool.uv.sources]
incidentlens-contracts = { workspace = true }
incidentlens-telemetry = { workspace = true }
incidentlens-scenarios = { workspace = true }
incidentlens-service-common = { workspace = true }
incidentlens-control-plane = { workspace = true }
incidentlens-gateway-service = { workspace = true }
incidentlens-order-service = { workspace = true }
incidentlens-payment-service = { workspace = true }
incidentlens-evaluation = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
