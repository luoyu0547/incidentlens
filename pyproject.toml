[project]
name = "incidentlens"
version = "0.2.0"
description = "A safety-first cloud incident investigation control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.30,<1",
    "asyncssh>=2.24,<3",
    "certifi>=2026.7.22,<2027",
    "cryptography>=48,<49",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.8,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/control-plane/src/incidentlens_control_plane"]

[tool.hatch.build.targets.wheel.force-include]
"apps/control-plane/src/incidentlens_control_plane/static/web" = "incidentlens_control_plane/static/web"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integrated: backend acceptance requiring composed adapters or durable restart",
]
