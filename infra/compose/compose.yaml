services:
  gateway-service:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    environment:
      - SERVICE=gateway
      - GATEWAY_PORT=8000
      - ORDER_SERVICE_URL=http://order-service:8001
      - CONTROL_PLANE_URL=http://control-plane:8003
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      order-service:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  order-service:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    environment:
      - SERVICE=order
      - ORDER_PORT=8001
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - CONTROL_PLANE_URL=http://control-plane:8003
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      payment-service:
        condition: service_healthy
      control-plane:
        condition: service_healthy

  payment-service:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    environment:
      - SERVICE=payment
      - PAYMENT_PORT=8002
      - CONTROL_PLANE_URL=http://control-plane:8003
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      control-plane:
        condition: service_healthy

  control-plane:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    environment:
      - SERVICE=control-plane
      - CONTROL_PLANE_PORT=8003
      - TELEMETRY_DB_URL=sqlite:////data/control_plane.db
      - INCIDENTLENS_AGENT_MODE=${INCIDENTLENS_AGENT_MODE:-llm_agent}
      - INCIDENTLENS_MODELS_CONFIG=/app/config/models.yaml
      - INCIDENTLENS_LLM_ACTIVE_MODEL=${INCIDENTLENS_LLM_ACTIVE_MODEL:-xfyun-xopglm51}
      - INCIDENTLENS_CHECKPOINT_DB=/data/agent_checkpoints.db
      - XFYUN_MAAS_API_KEY=${XFYUN_MAAS_API_KEY:-}
    ports:
      - "8003:8003"
    volumes:
      - control-plane-data:/data
      - ../../config:/app/config:ro
      - ../../skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  control-plane-data:
