# infra/acceptance/docker-compose.yml
services:
  postgres:
    build: ./services/postgres
    environment:
      POSTGRES_DB: acceptance
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d acceptance"]
      interval: 5s
      retries: 5

  order-stable:
    build: ./services/order-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: acceptance
      DB_USER: test
      DB_PASSWORD: test
      PAYMENT_URL: http://payment-service:5000
      REPLICA_NAME: stable
    depends_on:
      postgres:
        condition: service_healthy

  order-canary:
    build: ./services/order-service
    env_file:
      - ./config/order-canary.env
    environment:
      DB_HOST: postgres
      DB_NAME: acceptance
      DB_USER: test
      DB_PASSWORD: test
      PAYMENT_URL: http://payment-service:5000
      REPLICA_NAME: canary
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    env_file:
      - ./config/payment-policy.env

  inventory-service:
    build: ./services/inventory-service
    environment:
      FAULT_DEPENDENCY: "false"

  api-gateway:
    build: ./services/api-gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ORDER_STABLE_URL: http://order-stable:5000
      ORDER_CANARY_URL: http://order-canary:5000
      PAYMENT_URL: http://payment-service:5000
      INVENTORY_URL: http://inventory-service:5000
    depends_on:
      - order-stable
      - order-canary
      - payment-service
      - inventory-service
