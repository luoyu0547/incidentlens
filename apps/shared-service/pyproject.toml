[project]
name = "incidentlens-service-common"
version = "0.1.0"
description = "Shared service common code for IncidentLens microservices"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "incidentlens-contracts",
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_service_common"]
