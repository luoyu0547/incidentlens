<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IncidentLens{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/custom.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="il-app-shell">
    <header class="il-global-bar">
        <div class="il-wordmark">⌘ <span>AI</span></div>
        <div class="il-global-title">IncidentLens 中文网页设计</div>
        <div class="il-global-actions"><span class="il-online-dot"></span>本地运行时</div>
    </header>
    <aside class="il-sidebar">
        <a class="il-brand" href="/">
            <span class="il-brand-mark">✥</span>
            <span><strong>IncidentLens</strong><small>SECURE CONSOLE</small></span>
        </a>
        <div class="il-sidebar-label">导航</div>
        <nav class="il-nav">
            <a class="{% if request.url.path == '/' %}is-active{% endif %}" href="/"><span>▦</span>仪表盘</a>
            <a class="{% if '/investigations' in request.url.path %}is-active{% endif %}" href="/web/investigations"><span>⌕</span>调查详情</a>
            <a class="{% if '/logs' in request.url.path %}is-active{% endif %}" href="/web/logs/search"><span>▣</span>日志检索</a>
            <a class="{% if '/approvals' in request.url.path %}is-active{% endif %}" href="/web/approvals"><span>♢</span>审批中心{% if pending_approval_count|default(0) %}<b>{{ pending_approval_count }}</b>{% endif %}</a>
            <a class="{% if '/projects' in request.url.path %}is-active{% endif %}" href="/web/projects"><span>□</span>项目管理</a>
            <a class="{% if '/reports' in request.url.path %}is-active{% endif %}" href="/web/investigations"><span>▤</span>调查报告</a>
        </nav>
        <div class="il-sidebar-footer">
            <div class="il-system-status"><span class="il-online-dot"></span><span>系统运行正常</span></div>
            <div class="il-user"><span class="il-avatar">李</span><span><strong>李明远</strong><small>SRE 负责人</small></span></div>
        </div>
    </aside>
    <main class="il-main">
        <div class="il-breadcrumb"><span>IncidentLens</span><i>›</i><strong>{% block page_label %}仪表盘{% endblock %}</strong><span class="il-redaction">数据脱敏：已启用</span></div>
        <div class="il-content">
        {% block content %}{% endblock %}
        </div>
    </main>
    <script src="/static/js/events.js"></script>
</body>
</html>
