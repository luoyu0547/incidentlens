{% extends "base.html" %}
{% block title %}日志检索 — IncidentLens{% endblock %}
{% block page_label %}日志检索{% endblock %}
{% block content %}
<div class="il-page-heading"><div><h1>日志检索</h1><p>搜索已脱敏的主机与容器日志证据</p></div></div>
<form hx-get="/web/logs/search" hx-target="#results" hx-trigger="submit">
    <input type="text" name="query" placeholder="输入关键词、错误码或服务名...">
    <button type="submit">检索日志</button>
</form>
<div id="results">
{% include "logs/_results.html" %}
</div>
{% endblock %}
