[project]
name = "incidentlens-control-plane"
version = "0.1.0"
description = "Control plane API and audited read-only tools for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "incidentlens-contracts",
    "incidentlens-telemetry",
    "pydantic>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_control_plane"]
