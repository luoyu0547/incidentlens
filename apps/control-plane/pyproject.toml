[project]
name = "incidentlens-control-plane"
version = "0.1.0"
description = "Control plane API and audited read-only tools for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "incidentlens-contracts",
    "incidentlens-scenarios",
    "incidentlens-telemetry",
    "packaging>=24,<27",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2.0,<3",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.4,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "deepagents==0.6.12",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentlens_control_plane"]
