[project]
name = "incidentlens-order-service"
version = "0.1.0"
description = "Order service for IncidentLens"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "incidentlens-contracts",
    "incidentlens-service-common",
    "incidentlens-scenarios",
    "pydantic>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_service"]
